{{define "home"}}
<div class="hero">
    <h1>Welcome to Dynamo</h1>
</div>

<div class="dashboard">
    <div class="sidebar">
        <div class="stat-card">
            <h2>DNS Records</h2>
            <div class="stat-count" id="dns-total">–</div>
            <canvas id="dns-chart"></canvas>
        </div>

        <div class="stat-card">
            <h2>Certificates</h2>
            <div class="stat-count" id="certs-total">–</div>
            <canvas id="certs-chart"></canvas>
        </div>

        <div class="stat-card">
            <h2>Circuits</h2>
            <div class="stat-count" id="circuits-total">–</div>
            <canvas id="circuits-chart"></canvas>
        </div>
    </div>

    <div class="network-area">
        <div id="net-grid"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/home.js"></script>
{{end}}
