{{define "dns"}}
<div class="dns-manager">
    <div class="dns-header">
        <h1>DNS Records</h1>
        <button class="button" onclick="showAddRecordModal()">Add Record</button>
    </div>

    <div class="record-groups">
        <!-- A Records -->
        <div class="record-group">
            <h2>A Records</h2>
            <div class="records" id="a-records"></div>
        </div>

        <!-- CNAME Records -->
        <div class="record-group">
            <h2>CNAME Records</h2>
            <div class="records" id="cname-records"></div>
        </div>

        <!-- TXT Records -->
        <div class="record-group">
            <h2>TXT Records</h2>
            <div class="records" id="txt-records"></div>
        </div>

        <!-- SRV Records -->
        <div class="record-group">
            <h2>SRV Records</h2>
            <div class="records" id="srv-records"></div>
        </div>
    </div>
</div>

<!-- Add Record Modal -->
<div id="add-record-modal" class="modal">
    <div class="modal-content">
        <h2>Add DNS Record</h2>
        <form id="add-record-form">
            <div class="form-group">
                <label for="recordType">Type</label>
                <select id="recordType" onchange="updateFormFields()">
                    <option value="A">A Record</option>
                    <option value="CNAME">CNAME Record</option>
                    <option value="TXT">TXT Record</option>
                    <option value="SRV">SRV Record</option>
                </select>
            </div>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="ttl">TTL (seconds)</label>
                <input type="number" id="ttl" value="3600">
            </div>
            <!-- Dynamic fields based on record type -->
            <div id="dynamic-fields"></div>
            <div class="form-actions">
                <button type="button" class="button secondary" onclick="hideAddRecordModal()">Cancel</button>
                <button type="submit" class="button">Add Record</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Record Modal -->
<div id="edit-record-modal" class="modal">
    <div class="modal-content">
        <h2>Edit DNS Record</h2>
        <form id="edit-record-form">
            <input type="hidden" id="edit-record-id">
            <div class="form-group">
                <label for="edit-name">Name</label>
                <input type="text" id="edit-name" required>
            </div>
            <div class="form-group">
                <label for="edit-ttl">TTL (seconds)</label>
                <input type="number" id="edit-ttl">
            </div>
            <!-- Dynamic fields for editing -->
            <div id="edit-dynamic-fields"></div>
            <div class="form-actions">
                <button type="button" class="button secondary" onclick="hideEditRecordModal()">Cancel</button>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/dns.js"></script>
{{end}}
