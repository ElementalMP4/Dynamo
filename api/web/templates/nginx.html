{{define "nginx"}}
<div class="content">
    <div class="header">
        <h1>NGINX Config Manager</h1>
        <div class="actions">
            <button class="button primary" onclick="showGeneratorModal()">New Config</button>
        </div>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <h3>Available Configs</h3>
            <ul id="nginx-configs"></ul>
        </aside>

        <section class="main-area">
            <div id="editor-panel" style="display:none">
                <div class="editor-header">
                    <h2>Editing <span id="editor-filename"></span></h2>
                    <div class="editor-actions">
                        <button class="button primary" id="save-btn" onclick="saveConfig()">Save</button>
                        <button class="button secondary" id="toggle-btn" onclick="toggleConfig()">Enable/Disable</button>
                        <button class="button danger" id="delete-btn" onclick="deleteConfig()">Delete</button>
                        <button class="button warning" id="reload-btn" onclick="reloadNginx()" style="display:none">Reload NGINX</button>
                    </div>
                </div>
                <div class="editor-content">
                    <!-- simple textarea editor -->
                    <textarea id="config-editor" rows="20" style="width:100%; background:#0f1720; color:#e6eef6; border:1px solid #333; padding:8px; font-family: monospace;"></textarea>
                </div>
            </div>

            <div id="generator-output" style="display:none; margin-top:16px;">
                <h2>Generated Config</h2>
                <pre><code id="config-text"></code></pre>
                <button class="button secondary" onclick="downloadConfig()">Download</button>
            </div>
        </section>
    </div>

    <!-- Generator Modal -->
    <div id="generator-modal" class="modal" style="display:none">
        <div class="modal-content">
            <h2>Generate NGINX Config</h2>
            <form id="generator-form">
                <div class="form-group">
                    <label for="server-name">Server Name</label>
                    <input type="text" id="server-name" placeholder="e.g. example.com" required>
                </div>

                <div class="form-group">
                    <label for="proxy-pass">Proxy Target</label>
                    <input type="text" id="proxy-pass" placeholder="e.g. http://localhost:8080" required>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="enable-websocket">
                        Enable WebSocket Support
                    </label>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="enable-ssl">
                        Enable SSL
                    </label>
                </div>

                <div class="form-group" id="ssl-cert-group" style="display:none">
                    <label for="ssl-cert">Server Certificate</label>
                    <select id="ssl-cert"></select>
                </div>

                <div class="form-group">
                    <label for="config-name">Config Name</label>
                    <input type="text" id="config-name" placeholder="e.g. myapp.conf" required>
                </div>

                <div class="actions">
                    <button type="button" class="button secondary" onclick="hideGeneratorModal()">Cancel</button>
                    <button type="submit" class="button primary">Generate</button>
                </div>
            </form>
        </div>
    </div>

</div>

<!-- Load highlight.js for syntax highlighting (optional) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/nginx.min.js"></script>

<script src="/static/nginx.js"></script>
{{end}}
