<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyVTM DNS Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="nav-brand">TinyVTM</div>
        <div class="nav-items">
            <a href="/" class="nav-item">Home</a>
            <a href="/dns" class="nav-item">DNS Records</a>
            <a href="/certs" class="nav-item">Certificates</a>
            <a href="/nginx" class="nav-item">NGINX</a>
        </div>
    </nav>
    <main>
        {{if .isHome}}
            {{template "home" .}}
        {{else if .isDns}}
            {{template "dns" .}}
        {{else if .isCerts}}
            {{template "certs" .}}
        {{else if .isNginx}}
            {{template "nginx" .}}
        {{else}}
            {{template "home" .}}
        {{end}}
    </main>
</body>
</html>
