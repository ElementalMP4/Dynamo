<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamo</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <div class="nav-brand">Dynamo</div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-items" id="nav-items">
            <a href="/" class="nav-item">Home</a>
            <a href="/dns" class="nav-item">DNS Records</a>
            <a href="/certs" class="nav-item">Certificates</a>
            <a href="/circuits" class="nav-item">Circuits</a>
            <a href="/vpn" class="nav-item">VPN</a>
        </div>
    </nav>
    <main>
        {{if .isHome}}
            {{template "home" .}}
        {{else if .isDns}}
            {{template "dns" .}}
        {{else if .isCerts}}
            {{template "certs" .}}
        {{else if .isCircuits}}
            {{template "circuits" .}}
        {{else if .isVpn}}
            {{template "vpn" .}}
        {{else}}
            {{template "home" .}}
        {{end}}
    </main>

    <script>
        const toggle = document.getElementById('nav-toggle');
        const navItems = document.getElementById('nav-items');
        toggle.addEventListener('click', () => {
            navItems.classList.toggle('open');
        });
        // Close nav when a link is tapped
        navItems.querySelectorAll('.nav-item').forEach(link => {
            link.addEventListener('click', () => navItems.classList.remove('open'));
        });
    </script>
</body>
</html>
